name: Paper 1 release

on:
  push:
    tags:
      - 'paper1-v*'

permissions:
  contents: read

concurrency:
  group: paper1-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install check dependencies
        run: python -m pip install -r requirements-check.txt
      - name: Check metadata and packaging contracts
        run: make check
      - name: Build PDF and verify arXiv source archive
        run: make arxiv
      - name: Publish release with both assets already attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Resume a failed draft upload; never replace assets in an archived release.
          if gh release view "$RELEASE_TAG" --json isDraft > build/release.json; then
            python -c 'import json; assert json.load(open("build/release.json"))["isDraft"], "Release already published"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "EuroPriv-Bench — $RELEASE_TAG" --notes-file docs/paper1-release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/paper1.pdf dist/paper1-arxiv.tar.gz --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
